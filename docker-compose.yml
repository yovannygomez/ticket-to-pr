# Local Temporal, self-hosted the same way as on AWS: server + Postgres + UI.
# auto-setup creates the schema on first start (local only; on AWS a one-off
# task runs the schema migration before the server starts).
services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      - postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.58.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"

volumes:
  temporal-db:
